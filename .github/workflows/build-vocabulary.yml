name: Build vocabulary

on:
  push:
    paths:
      - "scripts/build_vocabulary.py"
      - ".github/workflows/build-vocabulary.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-vocabulary:
    runs-on: ubuntu-latest

    steps:
      - name: Check out EmniFun
        uses: actions/checkout@v4

      - name: Get ESDB source
        run: |
          git clone --depth 1 https://github.com/en-wl/wordlist.git /tmp/esdb
          git -C /tmp/esdb checkout 1e5b7d3a72f47a71da5d28686c1dd4b397178485

      - name: Build vocabulary
        run: |
          python3 scripts/build_vocabulary.py --esdb /tmp/esdb

      - name: Commit generated vocabulary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/valid-guesses.json data/vocabulary-build.json
          if git diff --cached --quiet; then
            echo "Vocabulary is already up to date."
          else
            git commit -m "chore: generate comprehensive five-letter vocabulary"
            git push
          fi
